<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kazi Admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="login-view" class="login-view" hidden>
      <section class="login-card">
        <div class="login-brand">
          <svg viewBox="0 0 64 64" class="mark" aria-hidden="true">
            <rect x="2" y="2" width="60" height="60" rx="18" fill="#007A5E" />
            <rect x="18" y="44" width="26" height="7" rx="3.5" fill="#FFFFFF" />
            <rect x="22" y="34" width="22" height="7" rx="3.5" fill="#FFFFFF" opacity="0.92" />
            <rect x="26" y="24" width="18" height="7" rx="3.5" fill="#FFFFFF" opacity="0.84" />
            <circle cx="46" cy="20" r="3.5" fill="#E8A33D" />
          </svg>
          <div>
            <div class="wordmark">Kazi</div>
          </div>
          <span class="pill push">Admin</span>
        </div>
        <p class="login-sub">Owner access only. Authorised personnel.</p>
        <form id="login-form" autocomplete="on">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <p id="login-error" class="form-error" hidden></p>
          <button id="login-button" class="btn btn-primary" type="submit">Sign in</button>
        </form>
        <p class="login-foot">Kazi admin console &middot; separate from the mobile app</p>
      </section>
    </main>

    <div id="dashboard-view" hidden>
      <header class="topbar">
        <div class="brand">
          <svg viewBox="0 0 64 64" class="mark sm" aria-hidden="true">
            <rect x="2" y="2" width="60" height="60" rx="18" fill="#007A5E" />
            <rect x="18" y="44" width="26" height="7" rx="3.5" fill="#FFFFFF" />
            <rect x="22" y="34" width="22" height="7" rx="3.5" fill="#FFFFFF" opacity="0.92" />
            <rect x="26" y="24" width="18" height="7" rx="3.5" fill="#FFFFFF" opacity="0.84" />
            <circle cx="46" cy="20" r="3.5" fill="#E8A33D" />
          </svg>
          <span class="wordmark">Kazi</span>
          <span class="pill">Admin</span>
        </div>
        <div class="spacer"></div>
        <div class="status">
          <span id="status-dot" class="dot off"></span>
          <span id="status-text">Connecting&hellip;</span>
        </div>
        <button id="refresh-button" class="btn btn-ghost" type="button">Refresh</button>
        <button id="logout-button" class="btn btn-ghost" type="button">Sign out</button>
      </header>

      <main class="content">
        <div id="stats" class="grid stats-grid"></div>

        <section class="panel card">
          <div class="panel-head">
            <h2>Growth &amp; activity</h2>
            <span class="hint">Last 30 days</span>
          </div>
          <div class="two-col">
            <div>
              <div class="panel-head"><h2>New signups</h2></div>
              <div id="signups-chart" class="chart"></div>
              <div id="signups-axis" class="axis"></div>
            </div>
            <div>
              <div class="panel-head"><h2>Transactions</h2></div>
              <div id="transactions-chart" class="chart"></div>
              <div id="transactions-axis" class="axis"></div>
            </div>
          </div>
        </section>

        <section class="panel card">
          <div class="panel-head">
            <h2>Feedback</h2>
            <span id="feedback-summary" class="hint"></span>
            <div class="spacer"></div>
            <button id="feedback-csv" class="btn btn-ghost" type="button">Download CSV</button>
          </div>
          <div id="feedback-list" class="feedback-list"></div>
        </section>

        <section class="panel card">
          <div class="panel-head">
            <h2>Recent activity</h2>
          </div>
          <div id="activity-table" class="table-wrap"></div>
        </section>

        <section class="panel card">
          <div class="panel-head">
            <h2>Users</h2>
            <span id="users-count" class="hint"></span>
          </div>
          <div id="users-table" class="table-wrap"></div>
        </section>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
