# Kazi CI (KZ-38). Jobs and steps follow docs/TESTING_QA.md "CI pipeline".
# Every job installs with `npm ci` from the committed lockfiles. shared/ is
# installed first in every job: its `prepare` script builds shared/dist, which
# the app and the server consume through `file:` links.
name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly, so new advisories surface even when nobody pushes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  app:
    name: App (typecheck, lint, Jest)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shared/package-lock.json
      - name: Install shared (builds shared/dist)
        run: npm ci
        working-directory: shared
      - name: Install app
        run: npm ci
      - name: Restore Jest transform cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'babel.config.js', 'jest.config.js') }}
          restore-keys: jest-${{ runner.os }}-
      - name: Shared checks
        run: npm run check
        working-directory: shared
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Jest
        run: npx jest --ci --maxWorkers=50% --cacheDirectory="${{ runner.temp }}/jest-cache"

  server:
    name: Server (typecheck, tests, build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            shared/package-lock.json
      - name: Install shared (builds shared/dist)
        run: npm ci
        working-directory: shared
      - name: Install server
        run: npm ci
        working-directory: server
      - name: Typecheck
        run: npm run typecheck
        working-directory: server
      - name: Tests
        run: npm test
        working-directory: server
      - name: Build
        run: npm run build
        working-directory: server

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking since KZ-19: `npm audit --omit=dev` must show no high or
    # critical advisory, except the build-tooling ones listed (with a review
    # date) in scripts/audit-exceptions.json and docs/SECURITY.md §6. The
    # gate reads only the lockfiles, so nothing is installed.
    strategy:
      fail-fast: false
      matrix:
        dir: ['.', 'server', 'shared']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit gate (${{ matrix.dir }})
        run: node scripts/audit-gate.js "${{ matrix.dir }}"

  # ---- Placeholders, completed in session 9 (KZ-09 / KZ-33) ----------------
  # Manual only until the signing secrets and the production API URL exist.

  android-release:
    name: Android release bundle (placeholder)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Not configured yet
        run: |
          echo "android-release is a placeholder. Session 9 (KZ-09) adds the upload-keystore"
          echo "secrets, KAZI_API_URL and ./gradlew bundleRelease."

  ios-build:
    name: iOS simulator build + launch without Firebase
    if: github.event_name == 'workflow_dispatch'
    # KZ-02: proves the iOS setup builds (Podfile flags, entitlements, the
    # GoogleService-Info.plist copy phase) and that the app starts with no
    # Firebase config. Unsigned simulator build, so it needs no Apple account.
    # Manual only (macOS minutes). Session 9 adds the signed archive.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shared/package-lock.json
      - name: Install shared (builds shared/dist)
        run: npm ci
        working-directory: shared
      - name: Install app
        run: npm ci
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install pods
        run: bundle exec pod install
        working-directory: ios
      - name: Build (Release, simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Kazi.xcworkspace -scheme Kazi -configuration Release             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'             -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build | tail -n 300
      - name: Launch without GoogleService-Info.plist
        run: |
          set -euo pipefail
          APP=ios/build/Build/Products/Release-iphonesimulator/Kazi.app
          test ! -f "$APP/GoogleService-Info.plist"
          UDID=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.kazi.app
          sleep 30
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q 'UIKitApplication:com.kazi.app'; then
            echo "::error::Kazi is not running 30 s after launch without Firebase"
            exit 1
          fi
          xcrun simctl spawn "$UDID" log show --last 5m --style compact             --predicate 'eventMessage CONTAINS "Firebase is not configured for this build"'             | grep -q 'Firebase is not configured for this build'
          echo "Kazi launched and kept running with push disabled."
